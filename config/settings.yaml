# --- Configuración de Almacenamiento ---
data_storage:
  sqlite:
    database_name: "jobs.db"       # Nombre del archivo SQLite en /data/
    table_name: "ofertas_empleo" # Nombre de la tabla
  csv:
    export_enabled: true           # ¿Exportar a CSV además de guardar en DB?
    export_directory: "data/historico" # Carpeta para los CSVs
    filename_format: "ofertas_{date}.csv" # Formato del nombre (se reemplaza {date})

# --- Fuentes de Datos ---
# ¡Aquí activas o desactivas cada API/Scraper!
# Cambia 'enabled: false' a 'enabled: true' para las fuentes que quieras probar.
sources:
  apis: # Clientes que usan APIs oficiales (generalmente más estables)
    adzuna:
      enabled: true # ¡Requiere APP_ID y APP_KEY en .env!
      base_api_url: "https://api.adzuna.com/v1/api/jobs/"
      results_per_page: 50
      default_country_code: 'co' # Colombia por defecto (cambia a 'ca' para Canadá, 'us' para EE.UU., o 'gb' para Reino Unido/Europa)
    arbeitnow:
      enabled: true # API pública para Alemania/Europa
      base_api_url: "https://www.arbeitnow.com/api/job-board-api"
    jobicy:
      enabled: true # API pública, global
    jooble:
      enabled: true # ¡Requiere JOOBLE_API_KEY en .env!
    remoteok:
      enabled: true # API pública JSON, remoto global
      base_api_url: "https://remoteok.com/api"

  scrapers: # Scrapers que leen HTML
    # --- Colombia ---
    computrabajo_co:
      enabled: true
      base_url: "https://www.computrabajo.com.co/"
    trabajando_co:
      enabled: true
      base_url: "https://www.trabajando.com/colombia"
    buscojobs:
      enabled: true
      base_url: "https://www.buscojobs.com.co/"
    linkedin_co:
      enabled: true
      base_url: "https://www.linkedin.com/jobs/search/?keywords=&location=Colombia"

    # --- Canadá ---
    jobbank_gc_ca:
      enabled: true
      base_url: "https://www.jobbank.gc.ca/home"
    indeed_ca:
      enabled: true
      base_url: "https://ca.indeed.com/"
    linkedin_ca:
      enabled: true
      base_url: "https://www.linkedin.com/jobs/search/?location=Canada"

    # --- Estados Unidos ---
    indeed_us:
      enabled: true
      base_url: "https://www.indeed.com/"
    linkedin_us:
      enabled: true
      base_url: "https://www.linkedin.com/jobs/search/?location=United%20States"

    # --- Europa ---
    eures:
      enabled: true
      base_url: "https://ec.europa.eu/eures/portal/"
    infojobs_es:
      enabled: true
      base_url: "https://www.infojobs.net/"
    stepstone_de:
      enabled: true
      base_url: "https://www.stepstone.de/"
    linkedin_eu:
      enabled: true
      base_url: "https://www.linkedin.com/jobs/search/?location=Europe"

    # --- Especializadas en Audio/Video/Producción ---
    mandy:
      enabled: true
      base_url: "https://www.mandy.com/jobs"
    soundlister:
      enabled: true
      base_url: "https://www.soundlister.com/"
    productionhub:
      enabled: true
      base_url: "https://www.productionhub.com/jobs"

    # --- Especializadas en E-Learning/Diseño Instruccional ---
    atd_jobs:
      enabled: true
      base_url: "https://www.td.org/jobs"
    elearning_guild:
      enabled: true
      base_url: "https://www.elearningguild.com/jobs"

    # --- Especializadas en Desarrollo de Juegos ---
    gamedev_net:
      enabled: true
      base_url: "https://www.gamedev.net/jobs/"
    hitmarker:
      enabled: true
      base_url: "https://hitmarker.net/jobs"

    # --- Freelance ---
    upwork:
      enabled: true
